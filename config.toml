[system]

[system.logger]
level = "DEBUG"
buffersize = 5
 # int (bytes) or str with suffix ("1b" , "1kb" , "1mb")
max_file_size = "64kb"
log_to_console = true
log_to_file = true
max_rotations = 3

[system.runtime]
interval = 0.1 # in s

[power]

[power.monitoring]
enabled = false

[power.battery]
battery_voltage_max = 7.2
battery_voltage_nominal = 6
battery_voltage_cut_off = 5.4
battery_ah = 12

[power.voltage_divider]
enabled = true
r1 = 10_000
r2 = 5_100

[comms]

[comms.mesh]
enabled = true
gateway = false